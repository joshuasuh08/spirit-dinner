<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who Said That? | Spirit Dinner</title><style>:root{--gold:#d9b76c;--bg:#101113;--white:#f7f3e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}.app{min-height:100vh;display:flex;flex-direction:column;padding:3vw 5vw}.top{display:flex;justify-content:space-between;align-items:center;color:var(--gold);letter-spacing:.16em;font-weight:800}.round{color:#aaa}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2rem}.eyebrow{color:var(--gold);font-size:clamp(1rem,2vw,1.6rem);letter-spacing:.22em;font-weight:bold}h1{font-size:clamp(2.3rem,5.8vw,6rem);max-width:1100px;line-height:1.14;margin:0}.answer{border-top:2px solid var(--gold);padding-top:1.5rem;max-width:900px}.name{font-size:clamp(2rem,4vw,4rem);color:var(--gold);font-weight:900}.source{color:#bbb;font-size:clamp(.85rem,1.3vw,1.15rem);margin-top:1rem}.warning{color:#ffce83;font-weight:bold;margin-top:1rem}.hint{color:#777;letter-spacing:.15em}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:1.5rem}button{cursor:pointer;border:1px solid var(--gold);border-radius:8px;background:transparent;color:var(--gold);padding:13px 20px;font-size:1rem;font-weight:700}button.primary{background:var(--gold);color:#161616}button:hover{filter:brightness(1.2)}.footer{color:#777;text-align:center;font-size:.8rem}body.fullscreen .app{padding:3vw 5vw}@media(max-width:600px){.app{padding:20px}.top{font-size:.7rem}.stage{gap:1.4rem}}</style></head><body><div class="app"><header class="top"><span>WEST POINT • SPIRIT DINNER</span><span class="round" id="counter"></span></header><main class="stage"><div class="eyebrow">WHO SAID THAT?</div><h1 id="quote"></h1><div id="answer" class="answer" hidden><div class="name" id="name"></div><div class="source" id="source"></div><div class="warning" id="warning"></div></div><div class="hint" id="hint">GUESS BEFORE THE REVEAL</div></main><nav class="controls"><button id="prev">← Previous</button><button id="reveal" class="primary">Reveal Answer</button><button id="next">Next Round →</button><button id="full">⛶ Fullscreen</button></nav><div class="footer">Keyboard: ← / → to navigate • Space to reveal • F for fullscreen. Some attributions are unverified and flagged.</div></div><script>const rounds=[{q:'I am not a sexual predator, I’m an offender.',a:'Jeffrey Epstein',s:'Reported in a 2011 New York Post interview. Verify original wording before public presentation.',v:false},{q:'I love the poorly educated.',a:'Donald Trump',s:'Nevada victory speech, 2016.',v:true},{q:'I am a god.',a:'Kanye West',s:'BBC Radio 1 interview, 2013.',v:true},{q:'Can’t stop, won’t stop.',a:'Sean “Diddy” Combs',s:'Longstanding Bad Boy Entertainment slogan (not a unique individual quotation).',v:true},{q:'I haven’t really seen one bad comment about my twerk video.',a:'Miley Cyrus',s:'Attributed to a 2013 interview; original wording not independently checked.',v:false},{q:'I don’t know what you’re talking about.',a:'EDP445',s:'Circulates in online clips; exact attribution has not been verified.',v:false},{q:'I am not a feminist.',a:'Sydney Sweeney',s:'Unverified attribution; do not present as a factual quote.',v:false},{q:'I bought her a fucking career.',a:'Jake Paul',s:'Attributed to a public feud; exact wording not independently verified.',v:false},{q:'What luck for rulers that men do not think.',a:'Adolf Hitler',s:'Widely misattributed to Hitler; no authenticated primary source.',v:false},{q:'We love death. The U.S. loves life.',a:'Osama bin Laden',s:'Reported in statements attributed to al-Qaeda; exact wording and attribution unverified.',v:false},{q:'I think if you have a problem, you should fix it.',a:'Kim Kardashian',s:'Attribution not independently verified.',v:false}];let i=0,shown=false;const el=id=>document.getElementById(id);function render(){let x=rounds[i];el('counter').textContent=`ROUND ${i+1} / ${rounds.length}`;el('quote').textContent='“'+x.q+'”';el('answer').hidden=!shown;el('name').textContent=x.a;el('source').textContent=x.s;el('warning').textContent=x.v?'':'⚠ UNVERIFIED ATTRIBUTION — NOT SAFE TO PRESENT AS AUTHENTIC';el('hint').hidden=shown;el('reveal').textContent=shown?'Hide Answer':'Reveal Answer'}function move(n){i=(i+n+rounds.length)%rounds.length;shown=false;render()}el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('reveal').onclick=()=>{shown=!shown;render()};el('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.code==='Space'){e.preventDefault();shown=!shown;render()}if(e.key.toLowerCase()==='f')el('full').click()});render();</script></body></html>
